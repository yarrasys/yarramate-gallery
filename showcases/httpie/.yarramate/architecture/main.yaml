format: yarramate/v1
id: httpie
profile: yarramate/core@0.1
concepts:
  - id: terminal-user
    kind: businessActor
    name: Terminal user
    description: >-
      A developer or operator invoking HTTPie from a shell. The console
      entrypoints and manual pages are the only interfaces the project ships.
  - id: http-cli
    kind: applicationComponent
    name: http/https command
    description: >-
      The main HTTPie executable (console scripts `http` and `https`, both
      mapped to httpie.__main__:main). Orchestrates parsing, request
      execution, and output through httpie/core.py.
  - id: manager-cli
    kind: applicationComponent
    name: httpie manager command
    description: >-
      The secondary `httpie` console script (httpie.manager.__main__:main).
      Provides maintenance tasks such as plugin install/uninstall/list and
      session upgrades, separate from request execution.
  - id: arg-parser
    kind: applicationComponent
    name: Argument parsing
    description: >-
      httpie/cli/ - the extended argparse definition (definition.py,
      argparser.py), request-item syntax (requestitems.py), and nested JSON
      handling. Turns argv plus stdin into a fully resolved namespace.
  - id: request-builder
    kind: applicationComponent
    name: Request building and sending
    description: >-
      httpie/client.py with adapters.py, ssl_.py, and uploads.py. Builds a
      requests.Session and PreparedRequest from parsed arguments, applies
      session state, and yields the request/response message sequence.
  - id: session-manager
    kind: applicationComponent
    name: Session management
    description: >-
      httpie/sessions.py. Loads and persists named or anonymous host-scoped
      sessions (headers, cookies, auth) built on the shared config
      dictionary machinery in httpie/config.py.
  - id: output-pipeline
    kind: applicationComponent
    name: Output formatting and printing
    description: >-
      httpie/output/ - stream selection (streams.py), processing chain
      (processing.py), formatter plugins (formatters/), Pygments lexers,
      and writer.py which writes messages to the terminal or a file.
  - id: download-manager
    kind: applicationComponent
    name: Download mode
    description: >-
      httpie/downloads.py. wget-like mode activated by --download; resolves
      target filenames, supports resume via Content-Range, and tracks
      progress. The body still flows through the stream machinery — core.py
      calls write_stream with the downloader's stream — so what --download
      bypasses is formatting and printing, not the output pipeline itself.
  - id: plugin-manager
    kind: applicationComponent
    name: Plugin manager
    description: >-
      httpie/plugins/ - plugin base interfaces (auth, formatter, transport,
      converter), the PluginManager registry, and built-in plugins
      registered in registry.py. Third-party plugins load via package entry
      points.
  - id: requests-lib
    kind: applicationComponent
    name: requests / urllib3
    description: >-
      External dependency (install_requires requests[socks]). Provides the
      HTTP transport - Session, PreparedRequest, connection pooling via
      urllib3 - beneath HTTPie's custom adapters.
  - id: pygments-lib
    kind: applicationComponent
    name: Pygments
    description: >-
      External dependency (install_requires Pygments>=2.5.2). Supplies
      lexers, styles, and terminal formatters used by the colour formatter
      in the output pipeline.
  - id: remote-server
    kind: applicationComponent
    name: Remote HTTP server
    description: >-
      Interpretation - any HTTP endpoint named by the user-supplied URL.
      Not part of this repository; it is the destination of every prepared
      request and the source of every response.
  - id: config-file
    kind: dataObject
    name: HTTPie config.json
    description: >-
      User configuration stored in the platform config directory
      (httpie/config.py, DEFAULT_CONFIG_DIR); supplies default_options and
      the plugins/sessions directory locations.
  - id: session-store
    kind: dataObject
    name: Session files
    description: >-
      Per-host JSON session files (headers, cookies, auth) under the
      sessions/ subdirectory of the config directory, or at an explicit
      path (httpie/sessions.py, DEFAULT_SESSIONS_DIR).
  - id: downloaded-file
    kind: dataObject
    name: Downloaded file
    description: >-
      The on-disk file produced by --download, named from
      Content-Disposition or the URL and de-duplicated before writing.
relationships:
  - id: cli-has-arg-parser
    kind: composition
    from: http-cli
    to: arg-parser
  - id: cli-has-request-builder
    kind: composition
    from: http-cli
    to: request-builder
  - id: cli-has-session-manager
    kind: composition
    from: http-cli
    to: session-manager
  - id: cli-has-output-pipeline
    kind: composition
    from: http-cli
    to: output-pipeline
  - id: cli-has-download-manager
    kind: composition
    from: http-cli
    to: download-manager
  - id: cli-has-plugin-manager
    kind: composition
    from: http-cli
    to: plugin-manager
  - id: user-invokes-cli
    kind: flow
    from: terminal-user
    to: http-cli
    content: command line and stdin
    description: The user runs http or https with a URL and request items.
  - id: cli-parses-args
    kind: flow
    from: http-cli
    to: arg-parser
    content: argv and environment
    description: core.main hands argv and the environment to the CLI parser.
  - id: parser-feeds-builder
    kind: flow
    from: arg-parser
    to: request-builder
    content: parsed argument namespace
    description: >-
      The resolved namespace (method, URL, headers, data, auth, session
      flags) drives client.collect_messages.
  - id: builder-uses-requests
    kind: flow
    from: request-builder
    to: requests-lib
    content: prepared HTTP request
    description: >-
      collect_messages builds a requests.Session, prepares the request, and
      dispatches it through HTTPie's HTTP/HTTPS adapters.
  - id: requests-exchanges-with-server
    kind: flow
    from: requests-lib
    to: remote-server
    content: HTTP request/response exchange
    description: >-
      requests/urllib3 performs the network exchange, including redirects
      when --follow is set.
  - id: builder-streams-messages
    kind: flow
    from: request-builder
    to: output-pipeline
    content: ordered request/response messages
    description: >-
      core.program iterates the collected messages and writes each through
      the output pipeline honouring --print/--verbose selections.
  - id: output-renders-to-user
    kind: flow
    from: output-pipeline
    to: terminal-user
    content: formatted output
    description: >-
      Headers and bodies are formatted, optionally colourised, and written
      to stdout or the requested output file.
  - id: builder-feeds-downloader
    kind: flow
    from: request-builder
    to: download-manager
    content: final response body stream
    description: >-
      With --download, core.program passes the final response to
      Downloader.start instead of printing the body.
  - id: downloader-writes-file
    kind: access
    from: download-manager
    to: downloaded-file
    mode: write
    description: The downloader streams the body to the resolved target file.
  - id: session-serves-builder
    kind: serving
    from: session-manager
    to: request-builder
    description: >-
      When --session/--session-read-only is set, collect_messages loads the
      session and applies its headers, cookies, and auth to the request.
  - id: session-accesses-store
    kind: access
    from: session-manager
    to: session-store
    mode: read-write
    description: Sessions are read on load and persisted back unless read-only.
  - id: cli-reads-config
    kind: access
    from: http-cli
    to: config-file
    mode: read
    description: >-
      Environment lazily loads Config from the config directory; parsing
      applies default_options before argv.
  - id: pygments-serves-output
    kind: serving
    from: pygments-lib
    to: output-pipeline
    description: >-
      The colour formatter builds Pygments lexers and terminal formatters
      to highlight headers and bodies.
  - id: plugins-serve-cli
    kind: serving
    from: plugin-manager
    to: http-cli
    description: >-
      The registry supplies auth types, formatters, converters, and
      transport plugins resolved during parsing and request execution.
  - id: user-invokes-manager
    kind: flow
    from: terminal-user
    to: manager-cli
    content: maintenance command
    description: The user runs httpie for maintenance tasks such as plugins.
  - id: manager-influences-plugins
    kind: association
    from: manager-cli
    to: plugin-manager
    description: >-
      httpie plugins install/uninstall runs pip against the configured
      plugins directory that the plugin manager loads at startup.
