format: yarramate/evidence/v1
id: httpie-repository-inspection
version: "1.0"
provider: repository-inspection
observations:
  - subject: httpie#terminal-user
    result: confirmed
    evidence:
      uri: repo:setup.cfg
      message: >-
        Classifiers declare Environment :: Console; console_scripts and
        man pages (options.data_files) are the shipped interfaces.
  - subject: httpie#http-cli
    result: confirmed
    evidence:
      uri: repo:setup.cfg
      message: >-
        [options.entry_points] console_scripts maps http and https to
        httpie.__main__:main, which delegates to httpie/core.py.
  - subject: httpie#manager-cli
    result: confirmed
    evidence:
      uri: repo:httpie/manager/__main__.py
      message: >-
        console_scripts maps httpie to httpie.manager.__main__:main; tasks
        live under httpie/manager/tasks/.
  - subject: httpie#arg-parser
    result: confirmed
    evidence:
      uri: repo:httpie/cli/definition.py
      message: >-
        core.main imports parser from httpie.cli.definition; argparser.py
        and requestitems.py implement parsing and request-item syntax.
  - subject: httpie#request-builder
    result: confirmed
    evidence:
      uri: repo:httpie/client.py
      message: >-
        collect_messages, build_requests_session, and make_request_kwargs
        construct and dispatch the request.
  - subject: httpie#session-manager
    result: confirmed
    evidence:
      uri: repo:httpie/sessions.py
      message: >-
        Session(BaseConfigDict) with get_httpie_session; DEFAULT_SESSIONS_DIR
        derives from the config directory.
  - subject: httpie#output-pipeline
    result: confirmed
    evidence:
      uri: repo:httpie/output/writer.py
      message: >-
        write_message/write_stream plus processing.py, streams.py,
        formatters/, and lexers/ under httpie/output/.
  - subject: httpie#download-manager
    result: confirmed
    evidence:
      uri: repo:httpie/downloads.py
      message: >-
        Downloader and DownloadStatus classes; parse_content_range
        implements resume support.
  - subject: httpie#plugin-manager
    result: confirmed
    evidence:
      uri: repo:httpie/plugins/manager.py
      message: >-
        PluginManager loads entry points via importlib_metadata;
        registry.py registers built-in auth plugins and formatters.
  - subject: httpie#requests-lib
    result: confirmed
    evidence:
      uri: repo:setup.cfg
      message: >-
        install_requires lists requests[socks]>=2.22.0; httpie/client.py
        imports requests and urllib3 directly.
  - subject: httpie#pygments-lib
    result: confirmed
    evidence:
      uri: repo:setup.cfg
      message: >-
        install_requires lists Pygments>=2.5.2; imported throughout
        httpie/output/formatters/colors.py and httpie/output/lexers/.
  - subject: httpie#remote-server
    result: confirmed
    evidence:
      uri: repo:httpie/client.py
      message: >-
        The prepared request targets the user-supplied URL. The server
        itself is outside the repository; the concept is an interpretation
        of the observed request destination.
  - subject: httpie#config-file
    result: confirmed
    evidence:
      uri: repo:httpie/config.py
      message: >-
        Config(BaseConfigDict) with DEFAULT_CONFIG_DIR resolution per
        platform and default_options support.
  - subject: httpie#session-store
    result: confirmed
    evidence:
      uri: repo:httpie/sessions.py
      message: >-
        DEFAULT_SESSIONS_DIR = DEFAULT_CONFIG_DIR / 'sessions';
        materialize_cookies/headers define the persisted shape.
  - subject: httpie#downloaded-file
    result: confirmed
    evidence:
      uri: repo:httpie/downloads.py
      message: >-
        filename_from_content_disposition, filename_from_url, and
        get_unique_filename resolve the target file the downloader writes.
  - claim: httpie#parser-feeds-builder
    result: confirmed
    evidence:
      uri: repo:httpie/core.py
      message: >-
        program(args, env) passes the parsed namespace to
        client.collect_messages.
  - claim: httpie#builder-uses-requests
    result: confirmed
    evidence:
      uri: repo:httpie/client.py
      message: >-
        requests.Request(**request_kwargs) is prepared on a
        requests.Session built by build_requests_session.
  - claim: httpie#requests-exchanges-with-server
    result: confirmed
    evidence:
      uri: repo:httpie/client.py
      message: requests_session.send performs the network exchange.
  - claim: httpie#builder-streams-messages
    result: confirmed
    evidence:
      uri: repo:httpie/core.py
      message: >-
        program iterates collect_messages and calls write_message for each
        request/response message.
  - claim: httpie#builder-feeds-downloader
    result: confirmed
    evidence:
      uri: repo:httpie/core.py
      message: >-
        Under args.download, downloader.start receives the final response
        and write_stream writes the body to the download target.
  - claim: httpie#session-serves-builder
    result: confirmed
    evidence:
      uri: repo:httpie/client.py
      message: >-
        collect_messages calls get_httpie_session and applies session
        headers, cookies, and auth when --session is present.
  - claim: httpie#cli-reads-config
    result: confirmed
    evidence:
      uri: repo:httpie/context.py
      message: >-
        Environment.config lazily constructs and loads Config from
        config_dir.
  - claim: httpie#pygments-serves-output
    result: confirmed
    evidence:
      uri: repo:httpie/output/formatters/colors.py
      message: >-
        ColorFormatter imports pygments lexers, styles, and formatters for
        terminal highlighting.
  - claim: httpie#plugins-serve-cli
    result: confirmed
    evidence:
      uri: repo:httpie/plugins/registry.py
      message: >-
        plugin_manager registers built-in auth plugins and formatters;
        core.py and client.py resolve plugins through it.
  - claim: httpie#manager-influences-plugins
    result: confirmed
    evidence:
      uri: repo:httpie/manager/tasks/plugins.py
      message: >-
        The plugins task runs pip install/uninstall against the configured
        plugins directory.
  - claim: httpie#user-invokes-cli
    result: not-observed
    evidence:
      uri: repo:docs/README.md
      message: >-
        Invocation by a human at a terminal is documented usage, not
        behaviour observable from static repository inspection.
