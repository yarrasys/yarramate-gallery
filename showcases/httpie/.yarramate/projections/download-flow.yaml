format: yarramate/projection/v1
id: download-flow
version: "1.0"
query:
  subjects:
    - httpie#terminal-user
    - httpie#http-cli
    - httpie#arg-parser
    - httpie#request-builder
    - httpie#requests-lib
    - httpie#remote-server
    - httpie#download-manager
    - httpie#downloaded-file
  relationships: between
presentation:
  title: Download flow
  description: >-
    Ordered flow of a --download invocation - parsing and sending proceed
    as usual, then the final response body streams through the Downloader
    to a resolved on-disk file instead of the output pipeline.
