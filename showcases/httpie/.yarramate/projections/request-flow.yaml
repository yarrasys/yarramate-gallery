format: yarramate/projection/v1
id: request-flow
version: "1.0"
query:
  subjects:
    - httpie#terminal-user
    - httpie#http-cli
    - httpie#arg-parser
    - httpie#request-builder
    - httpie#requests-lib
    - httpie#remote-server
    - httpie#output-pipeline
  relationships: between
presentation:
  title: Request flow
  description: >-
    Ordered flow of a normal invocation - the user runs http/https, argv is
    parsed, the request is built and sent through requests/urllib3, and the
    request/response messages are formatted and printed.
