format: yarramate/likec4-project/v1
id: kafka
version: "1.0"
title: Apache Kafka architecture (4.3.1, KRaft)
mapping: integrations/likec4/subject-mapping.yaml
views:
  - projection: projections/system-overview.yaml
  - projection: projections/replication-and-storage.yaml
  - projection: projections/metadata-plane.yaml
  - id: produce-path
    projection: projections/produce-path.yaml
    dynamic:
      steps:
        - relationship: kafka#producer-sends-records
        - relationship: kafka#broker-appends-log
        - relationship: kafka#log-appends-segment
        - relationship: kafka#broker-replicates-followers
        - relationship: kafka#replica-manager-manages-isr
        - relationship: kafka#replica-manager-manages-hw
        - relationship: kafka#broker-acks-producer
  - id: consumer-group-coordination
    projection: projections/consumer-group-coordination.yaml
    dynamic:
      steps:
        - relationship: kafka#consumer-joins-group
        - relationship: kafka#assignor-computes-assignment
        - relationship: kafka#coordinator-delivers-assignment
        - relationship: kafka#consumer-fetches-records
        - relationship: kafka#consumer-commits-offsets
        - relationship: kafka#coordinator-manages-offsets
