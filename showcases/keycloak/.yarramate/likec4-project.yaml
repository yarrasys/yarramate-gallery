format: yarramate/likec4-project/v1
id: keycloak
version: "1.0"
title: Keycloak architecture
mapping: integrations/likec4/subject-mapping.yaml
views:
  - projection: projections/system-overview.yaml
  - projection: projections/protocol-surfaces.yaml
  - projection: projections/authorization-services.yaml
  - id: direct-login-flow
    projection: projections/direct-login-flow.yaml
    dynamic:
      steps:
        - relationship: keycloak#client-requests-oidc
        - relationship: keycloak#oidc-hands-to-auth-engine
        - relationship: keycloak#auth-engine-looks-up-user
        - relationship: keycloak#auth-engine-uses-federation
        - relationship: keycloak#auth-engine-returns-to-oidc
        - relationship: keycloak#oidc-issues-token
        - relationship: keycloak#token-issued-to-client
  - id: brokered-login-flow
    projection: projections/brokered-login-flow.yaml
    dynamic:
      steps:
        - relationship: keycloak#client-requests-oidc
        - relationship: keycloak#oidc-brokers-login
        - relationship: keycloak#broker-redirects-to-idp
        - relationship: keycloak#idp-returns-identity
        - relationship: keycloak#broker-maps-user
        - relationship: keycloak#broker-returns-to-oidc
        - relationship: keycloak#oidc-issues-token
        - relationship: keycloak#token-issued-to-client
