format: yarramate/projection/v1
id: protocol-surfaces
version: "1.0"
query:
  subjects:
    - keycloak#end-user
    - keycloak#client-application
    - keycloak#administrator
    - keycloak#oidc-protocol-endpoint
    - keycloak#saml-protocol-endpoint
    - keycloak#admin-rest-api
    - keycloak#account-service
    - keycloak#token-service
  relationships: between
presentation:
  title: Protocol and administration surfaces
  description: >-
    The externally meaningful entry points: the OIDC/OAuth 2.0 and SAML 2.0
    protocol endpoints for client applications, and the admin and account
    surfaces for administrators and end users.
