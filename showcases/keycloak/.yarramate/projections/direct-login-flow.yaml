format: yarramate/projection/v1
id: direct-login-flow
version: "1.0"
query:
  subjects:
    - keycloak#client-application
    - keycloak#oidc-protocol-endpoint
    - keycloak#authentication-flow-engine
    - keycloak#user-federation
    - keycloak#jpa-store
    - keycloak#token-service
    - keycloak#user
    - keycloak#credential
  relationships: between
presentation:
  title: Direct login flow (OIDC authorization code)
  description: >-
    Ordered flow: a client application requests authorization, the OIDC endpoint
    hands off to the authentication flow, the flow resolves the user and
    validates credentials against the local store (and, for federated users,
    the user-federation bridge), an authorization code is issued, and tokens are
    minted and returned to the client.
