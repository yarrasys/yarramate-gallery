format: yarramate/v1
id: keycloak
profile: yarramate/core@0.1
concepts:
  # --- Actors and external parties (interpretation supported by repository + docs) ---
  - id: end-user
    kind: businessActor
    name: End user
    status: current
    description: >-
      Person who authenticates through Keycloak to obtain access to a client
      application, and who manages their own account through the account
      console.
  - id: client-application
    kind: applicationComponent
    name: Client application / relying party
    status: current
    description: >-
      External application (OIDC or SAML relying party) that delegates
      authentication to Keycloak and consumes issued tokens or assertions.
  - id: administrator
    kind: businessActor
    name: Administrator
    status: current
    description: >-
      Person who manages realms, clients, users, roles, identity providers, and
      authorization policy through the Admin Console and Admin REST API.
  - id: external-idp
    kind: applicationComponent
    name: External identity provider
    status: current
    description: >-
      External identity provider (for example Google, GitHub, or a SAML/OIDC
      IdP) used for brokered login through Keycloak's identity broker.
  - id: ldap-directory
    kind: systemSoftware
    name: LDAP / Active Directory server
    status: current
    description: >-
      External directory server (LDAP or Active Directory) that stores user
      accounts and credentials and is consumed by Keycloak's user-federation
      bridge.
  - id: relational-database
    kind: systemSoftware
    name: Relational database
    status: current
    description: >-
      External relational database (PostgreSQL, MariaDB/MySQL, MSSQL, Oracle, or
      DB2) that persists the Keycloak domain model through the JPA store.

  # --- The Keycloak server process and its observed parts ---
  - id: keycloak-server
    kind: applicationComponent
    name: Keycloak server
    status: current
    description: >-
      The Quarkus server process (quarkus/runtime KeycloakMain, QuarkusKeycloakApplication)
      that hosts the JAX-RS application, the session factory, and every internal
      service as one running server.
  - id: admin-rest-api
    kind: applicationComponent
    name: Admin Console and Admin REST API
    status: current
    description: >-
      Administration surface rooted at /admin (AdminRoot): the Admin REST API
      under /admin/realms plus the React Admin Console SPA it serves.
  - id: account-service
    kind: applicationComponent
    name: Account console and Account REST API
    status: current
    description: >-
      End-user self-service surface (AccountLoader / AccountRestService) for
      profile, credentials, sessions, and consent, served under the realm.
  - id: authentication-flow-engine
    kind: applicationComponent
    name: Authentication flow engine
    status: current
    description: >-
      Executes configurable authentication flows (LoginActionsService,
      AuthenticationProcessor, DefaultAuthenticationFlow): renders the login
      forms, validates credentials, and completes or restarts the login.
  - id: token-service
    kind: applicationComponent
    name: Token service
    status: current
    description: >-
      Mints, refreshes, introspects, and revokes OIDC access/ID/refresh tokens
      and SAML assertions (TokenManager), invoked by the protocol endpoints.
  - id: identity-broker
    kind: applicationComponent
    name: Identity broker
    status: current
    description: >-
      Brokers login to external identity providers (IdentityBrokerService and the
      broker/oidc, broker/saml, and social provider packages), mapping a returned
      identity onto a realm user.
  - id: user-federation
    kind: applicationComponent
    name: User-federation bridge
    status: current
    description: >-
      The UserStorageProvider SPI bridge (model/storage) with its LDAP/Active
      Directory and Kerberos providers (federation/ldap, federation/kerberos)
      that validates federated users and optionally imports them.
  - id: authorization-service
    kind: applicationComponent
    name: Authorization services
    status: current
    description: >-
      Fine-grained authorization services (services/authorization,
      AuthorizationService, Protection API) over resources, scopes, and policies
      persisted as authorization entities.
  - id: policy-enforcer
    kind: applicationComponent
    name: Policy enforcer
    status: current
    description: >-
      Client-side enforcement of resource permissions, evidenced by the
      PolicyEnforcerConfig, AuthorizationContext, and the authz/client library;
      the enforcer runtime runs inside protected applications.
  - id: protocol-mapper
    kind: applicationComponent
    name: Protocol mappers
    status: current
    description: >-
      SPI mappers (protocol/oidc/mappers, AbstractOIDCProtocolMapper) that
      transform user/role/session data into token claims and SAML attributes.
  - id: spi-provider-model
    kind: applicationComponent
    name: SPI provider model
    status: current
    description: >-
      The Provider / ProviderFactory / Spi extension model (server-spi) that
      authenticators, storage providers, identity providers, and protocol
      mappers implement to plug into the server.
  - id: oidc-protocol-endpoint
    kind: applicationComponent
    name: OpenID Connect / OAuth 2.0 endpoint
    status: current
    description: >-
      The OIDC protocol service under /realms/{realm}/protocol/openid-connect
      (OIDCLoginProtocolService) exposing authorization, token, userinfo, logout,
      introspection, and revocation endpoints and the OAuth 2.0 grant types.
  - id: saml-protocol-endpoint
    kind: applicationComponent
    name: SAML 2.0 endpoint
    status: current
    description: >-
      The SAML 2.0 protocol service (SamlService, SamlProtocol) handling
      authentication, artifact resolution, single logout, and IdP metadata.
  - id: jpa-store
    kind: applicationComponent
    name: JPA model store
    status: current
    description: >-
      The JPA-backed model store (model/jpa) whose providers (JpaRealmProvider,
      JpaUserProvider, JpaClientProvider) own all persistence of the domain model.
  - id: infinispan-cache
    kind: systemSoftware
    name: Infinispan cache
    status: current
    description: >-
      The Infinispan-backed cache (model/infinispan) that fronts the store for
      realm, user, and session lookups on the hot path.

  # --- Principal information ---
  - id: realm
    kind: dataObject
    name: Realm
    status: current
    description: >-
      A tenant's configuration scope (RealmModel) owning its clients, users,
      roles, groups, identity providers, and authentication flows.
  - id: client
    kind: dataObject
    name: Client
    status: current
    description: >-
      A client / relying party (ClientModel) with its protocol, redirect URIs,
      scopes, and secrets.
  - id: client-scope
    kind: dataObject
    name: Client scope
    status: current
    description: >-
      A reusable OAuth/OIDC scope (ClientScopeModel) mapping to a bundle of
      roles and protocol-mapper claims.
  - id: user
    kind: dataObject
    name: User
    status: current
    description: >-
      A user account (UserModel) with attributes, role and group mappings, and
      required actions.
  - id: role
    kind: dataObject
    name: Role
    status: current
    description: >-
      A role (RoleModel) assignable to users, groups, or clients and mapped into
      token claims.
  - id: group
    kind: dataObject
    name: Group
    status: current
    description: >-
      A group (GroupModel) that organizes users and carries role mappings.
  - id: user-session
    kind: dataObject
    name: User and client session
    status: current
    description: >-
      Persistent SSO and client sessions (UserSessionModel,
      AuthenticatedClientSessionModel) backing issued tokens.
  - id: credential
    kind: dataObject
    name: Credential
    status: current
    description: >-
      A stored user credential (UserCredentialModel) such as a password, OTP, or
      WebAuthn/passkey public key.
  - id: authorization-resource
    kind: dataObject
    name: Authorization resource, scope, and policy
    status: current
    description: >-
      The authorization data objects (ResourceEntity, ScopeEntity, PolicyEntity)
      that define protected resources, their scopes, and the policies governing
      access to them.

relationships:
  # --- Composition: the single server process contains every internal part ---
  - id: server-composes-oidc-endpoint
    kind: composition
    from: keycloak-server
    to: oidc-protocol-endpoint
  - id: server-composes-saml-endpoint
    kind: composition
    from: keycloak-server
    to: saml-protocol-endpoint
  - id: server-composes-auth-engine
    kind: composition
    from: keycloak-server
    to: authentication-flow-engine
  - id: server-composes-token-service
    kind: composition
    from: keycloak-server
    to: token-service
  - id: server-composes-identity-broker
    kind: composition
    from: keycloak-server
    to: identity-broker
  - id: server-composes-user-federation
    kind: composition
    from: keycloak-server
    to: user-federation
  - id: server-composes-admin-rest-api
    kind: composition
    from: keycloak-server
    to: admin-rest-api
  - id: server-composes-account-service
    kind: composition
    from: keycloak-server
    to: account-service
  - id: server-composes-authorization-service
    kind: composition
    from: keycloak-server
    to: authorization-service
  - id: server-composes-jpa-store
    kind: composition
    from: keycloak-server
    to: jpa-store
  - id: server-composes-spi-model
    kind: composition
    from: keycloak-server
    to: spi-provider-model
  - id: server-composes-cache
    kind: composition
    from: keycloak-server
    to: infinispan-cache
  - id: server-composes-protocol-mapper
    kind: composition
    from: keycloak-server
    to: protocol-mapper

  # --- Serving: protocol and admin surfaces serve their clients ---
  - id: oidc-endpoint-serves-clients
    kind: serving
    from: oidc-protocol-endpoint
    to: client-application
    description: Client applications and relying parties authenticate and obtain tokens over the OIDC/OAuth 2.0 endpoints.
  - id: saml-endpoint-serves-clients
    kind: serving
    from: saml-protocol-endpoint
    to: client-application
    description: SAML relying parties consume SSO and single-logout over the SAML 2.0 endpoints.
  - id: admin-rest-api-serves-administrator
    kind: serving
    from: admin-rest-api
    to: administrator
    description: Administrators manage the server through the Admin Console and Admin REST API.
  - id: account-service-serves-end-user
    kind: serving
    from: account-service
    to: end-user
    description: End users manage their own profile, credentials, and sessions through the account console.

  # --- Storage layer: the database and the shared store ---
  - id: db-serves-store
    kind: serving
    from: relational-database
    to: jpa-store
    description: The relational database provides persistence; the JPA store issues all SQL.
  - id: store-serves-admin-rest
    kind: serving
    from: jpa-store
    to: admin-rest-api
  - id: store-serves-account
    kind: serving
    from: jpa-store
    to: account-service
  - id: store-serves-authz
    kind: serving
    from: jpa-store
    to: authorization-service
  - id: store-serves-token-service
    kind: serving
    from: jpa-store
    to: token-service

  # --- SPI provider model serves the extension points ---
  - id: spi-serves-auth-engine
    kind: serving
    from: spi-provider-model
    to: authentication-flow-engine
    description: The Authenticator SPI lets flows plug in custom authentication steps.
  - id: spi-serves-user-federation
    kind: serving
    from: spi-provider-model
    to: user-federation
    description: The UserStorageProvider SPI lets custom storage backends plug in.
  - id: spi-serves-broker
    kind: serving
    from: spi-provider-model
    to: identity-broker
    description: The IdentityProvider SPI lets custom external identity providers plug in.
  - id: spi-serves-protocol-mapper
    kind: serving
    from: spi-provider-model
    to: protocol-mapper
    description: The ProtocolMapper SPI lets custom claim mappers plug in.
  - id: protocol-mapper-serves-token
    kind: serving
    from: protocol-mapper
    to: token-service
    description: Protocol mappers supply the claims and attributes placed into issued tokens.

  # --- Principal information managed by the store ---
  - id: store-manages-realm
    kind: access
    from: jpa-store
    to: realm
    mode: read-write
  - id: store-manages-client
    kind: access
    from: jpa-store
    to: client
    mode: read-write
  - id: store-manages-client-scope
    kind: access
    from: jpa-store
    to: client-scope
    mode: read-write
  - id: store-manages-user
    kind: access
    from: jpa-store
    to: user
    mode: read-write
  - id: store-manages-role
    kind: access
    from: jpa-store
    to: role
    mode: read-write
  - id: store-manages-group
    kind: access
    from: jpa-store
    to: group
    mode: read-write
  - id: store-manages-session
    kind: access
    from: jpa-store
    to: user-session
    mode: read-write
  - id: store-manages-credential
    kind: access
    from: jpa-store
    to: credential
    mode: read-write
  - id: store-manages-authz-resource
    kind: access
    from: jpa-store
    to: authorization-resource
    mode: read-write

  # --- Cache fronts the store on the hot path ---
  - id: cache-fronts-store
    kind: flow
    from: infinispan-cache
    to: jpa-store
    content: Cache-miss realm, user, and session lookups
    description: On a cache miss the Infinispan cache delegates realm/user/session lookups to the JPA store.

  # --- Direct login flow (OIDC authorization code grant) ---
  - id: client-requests-oidc
    kind: flow
    from: client-application
    to: oidc-protocol-endpoint
    content: OIDC authorization and token requests
    description: The client application redirects the user to, and exchanges codes at, the OIDC endpoints.
  - id: oidc-hands-to-auth-engine
    kind: flow
    from: oidc-protocol-endpoint
    to: authentication-flow-engine
    content: Login handoff
    description: The protocol endpoint hands authentication off to the configured login flow.
  - id: auth-engine-looks-up-user
    kind: flow
    from: authentication-flow-engine
    to: jpa-store
    content: User lookup and credential validation
    description: The flow resolves the local user and validates its stored credentials.
  - id: auth-engine-uses-federation
    kind: flow
    from: authentication-flow-engine
    to: user-federation
    content: Federated credential check
    description: For federated users the flow validates credentials through the user-federation bridge.
  - id: auth-engine-returns-to-oidc
    kind: flow
    from: authentication-flow-engine
    to: oidc-protocol-endpoint
    content: Authenticated session and authorization code
    description: On success the flow completes and an authorization code is issued back to the protocol endpoint.
  - id: oidc-issues-token
    kind: flow
    from: oidc-protocol-endpoint
    to: token-service
    content: Code exchange and token minting
    description: The token endpoint exchanges the code for access, ID, and refresh tokens.
  - id: token-issued-to-client
    kind: flow
    from: token-service
    to: client-application
    content: Access, ID, and refresh tokens
    description: The minted tokens (or SAML assertions) are returned to the client application.

  # --- Brokered login flow ---
  - id: oidc-brokers-login
    kind: flow
    from: oidc-protocol-endpoint
    to: identity-broker
    content: Broker-login request
    description: The protocol endpoint routes the login through the identity broker to an external provider.
  - id: broker-redirects-to-idp
    kind: flow
    from: identity-broker
    to: external-idp
    content: Redirect to external identity provider
    description: The broker redirects the user to the configured external identity provider.
  - id: idp-returns-identity
    kind: flow
    from: external-idp
    to: identity-broker
    content: Authenticated identity
    description: The external provider returns an authenticated identity to the broker callback.
  - id: broker-maps-user
    kind: flow
    from: identity-broker
    to: jpa-store
    content: Realm user mapping and provisioning
    description: The broker maps the returned identity onto an existing or newly provisioned realm user.
  - id: broker-returns-to-oidc
    kind: flow
    from: identity-broker
    to: oidc-protocol-endpoint
    content: Brokered authentication complete
    description: The broker completes the first/post-broker login flow and hands control back to the protocol endpoint.

  # --- User federation against the directory ---
  - id: federation-looks-up-ldap
    kind: flow
    from: user-federation
    to: ldap-directory
    content: Federated user and credential lookups
    description: The federation bridge queries and validates users against the LDAP/Active Directory server.
  - id: federation-syncs-store
    kind: flow
    from: user-federation
    to: jpa-store
    content: Imported and synced federated users
    description: When import synchronization is enabled, federated users are written back into the local store.

  # --- Authorization services and policy enforcement ---
  - id: enforcer-protects-client
    kind: serving
    from: policy-enforcer
    to: client-application
    description: >-
      The policy enforcer mediates access to the application's protected
      resources; whether any given deployment embeds it is not observable from
      this server repository.
  - id: enforcer-checks-authz
    kind: flow
    from: policy-enforcer
    to: authorization-service
    content: Permission and policy decisions
    description: The enforcer obtains permission and policy decisions from the authorization services.
