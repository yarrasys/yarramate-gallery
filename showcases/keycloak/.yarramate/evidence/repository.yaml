format: yarramate/evidence/v1
id: keycloak-repository
version: "1.0"
provider: repository-inspection
observations:
  # --- Concepts ---
  - subject: keycloak#end-user
    result: confirmed
    evidence:
      uri: repo:README.md
      message: Product documentation describes an IAM server authenticating end users; the actor itself is an interpretation.
  - subject: keycloak#client-application
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/ClientModel.java
      message: The client model with protocol, redirect URIs, and scopes implies external relying-party applications.
  - subject: keycloak#administrator
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/admin/AdminRoot.java
      message: Admin REST API and Admin Console under /admin imply an administrator actor.
  - subject: keycloak#external-idp
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/social
      message: One provider package per external IdP (google, github, gitlab, microsoft, ...); plus broker/oidc and broker/saml.
  - subject: keycloak#ldap-directory
    result: confirmed
    evidence:
      uri: repo:federation/ldap/src/main/java/org/keycloak/storage/ldap/LDAPStorageProviderFactory.java
      message: LDAP federation with edit modes and import synchronization implies an external LDAP/Active Directory server.
  - subject: keycloak#relational-database
    result: confirmed
    evidence:
      uri: repo:quarkus/runtime/src/main/java/org/keycloak/quarkus/runtime/configuration/mappers/DatabasePropertyMappers.java
      message: Supported vendors include postgres, mariadb, mysql, mssql, oracle, and db2.
  - subject: keycloak#keycloak-server
    result: confirmed
    evidence:
      uri: repo:quarkus/runtime/src/main/java/org/keycloak/quarkus/runtime/KeycloakMain.java
      message: "@QuarkusMain entry point initializes the CLI and starts the server via QuarkusKeycloakApplication."
  - subject: keycloak#admin-rest-api
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/admin/AdminRoot.java
      message: JAX-RS root at @Path("/admin") exposing /admin/realms and the admin console; Admin Console SPA in js/apps/admin-ui.
  - subject: keycloak#account-service
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/account/AccountRestService.java
      message: Account REST and console (AccountLoader) for end-user self-service.
  - subject: keycloak#authentication-flow-engine
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/authentication/AuthenticationProcessor.java
      message: Executes flows via DefaultAuthenticationFlow; login forms and actions in LoginActionsService.
  - subject: keycloak#token-service
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/TokenManager.java
      message: TokenManager mints, refreshes, and validates tokens; invoked by TokenEndpoint.
  - subject: keycloak#identity-broker
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/IdentityBrokerService.java
      message: /realms/{realm}/broker endpoints for login, link, callback, and token retrieval.
  - subject: keycloak#user-federation
    result: confirmed
    evidence:
      uri: repo:model/storage/src/main/java/org/keycloak/storage/UserStorageProvider.java
      message: UserStorageProvider SPI with LDAP (federation/ldap) and Kerberos (federation/kerberos) providers.
  - subject: keycloak#authorization-service
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/authorization/AuthorizationService.java
      message: Protection API over resources, scopes, and policies; entities in model/jpa authorization.
  - subject: keycloak#policy-enforcer
    result: confirmed
    evidence:
      uri: repo:core/src/main/java/org/keycloak/representations/adapters/config/PolicyEnforcerConfig.java
      message: "PolicyEnforcerConfig and AuthorizationContext (core) plus AuthzClient (authz/client); the enforcer runtime runs client-side."
  - subject: keycloak#protocol-mapper
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/mappers/AbstractOIDCProtocolMapper.java
      message: Protocol-mapper SPI transforming user/role data into token claims and SAML attributes.
  - subject: keycloak#spi-provider-model
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/provider/Provider.java
      message: Provider/ProviderFactory/Spi extension model discovered via META-INF/services Spi files.
  - subject: keycloak#oidc-protocol-endpoint
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/OIDCLoginProtocolService.java
      message: OIDC protocol service exposing authorization, token, userinfo, logout, introspection, and revocation.
  - subject: keycloak#saml-protocol-endpoint
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/saml/SamlService.java
      message: SAML 2.0 protocol handling SSO, artifact resolution, single logout, and IdP metadata descriptor.
  - subject: keycloak#jpa-store
    result: confirmed
    evidence:
      uri: repo:model/jpa/src/main/java/org/keycloak/models/jpa/JpaRealmProvider.java
      message: "JpaRealmProvider implements RealmProvider, ClientProvider, GroupProvider, RoleProvider; JpaUserProvider owns users."
  - subject: keycloak#infinispan-cache
    result: confirmed
    evidence:
      uri: repo:model/infinispan/src/main/java/org/keycloak/models/cache/infinispan/InfinispanCacheRealmProviderFactory.java
      message: Infinispan-backed realm and user cache providers fronting the JPA store.
  - subject: keycloak#realm
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/RealmModel.java
  - subject: keycloak#client
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/ClientModel.java
  - subject: keycloak#client-scope
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/ClientScopeModel.java
  - subject: keycloak#user
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/UserModel.java
  - subject: keycloak#role
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/RoleModel.java
  - subject: keycloak#group
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/GroupModel.java
  - subject: keycloak#user-session
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/UserSessionModel.java
  - subject: keycloak#credential
    result: confirmed
    evidence:
      uri: repo:server-spi/src/main/java/org/keycloak/models/UserCredentialModel.java
  - subject: keycloak#authorization-resource
    result: confirmed
    evidence:
      uri: repo:model/jpa/src/main/java/org/keycloak/authorization/jpa/entities/ResourceEntity.java
      message: Resource, Scope, and Policy entities persisted by the authorization store.

  # --- Key claims ---
  - claim: keycloak#db-serves-store
    result: confirmed
    evidence:
      uri: repo:quarkus/runtime/src/main/java/org/keycloak/quarkus/runtime/storage/database/jpa/QuarkusJpaConnectionProviderFactory.java
      message: JPA connection provider factory bound to the configured relational database.
  - claim: keycloak#store-manages-realm
    result: confirmed
    evidence:
      uri: repo:model/jpa/src/main/java/org/keycloak/models/jpa/entities/RealmEntity.java
  - claim: keycloak#store-manages-user
    result: confirmed
    evidence:
      uri: repo:model/jpa/src/main/java/org/keycloak/models/jpa/JpaUserProvider.java
  - claim: keycloak#store-manages-authz-resource
    result: confirmed
    evidence:
      uri: repo:model/jpa/src/main/java/org/keycloak/authorization/jpa/entities/PolicyEntity.java
  - claim: keycloak#cache-fronts-store
    result: confirmed
    evidence:
      uri: repo:model/infinispan/src/main/java/org/keycloak/models/cache/infinispan/InfinispanUserCacheProviderFactory.java
      message: Cache providers front the JPA providers; misses delegate to the store.
  - claim: keycloak#client-requests-oidc
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/endpoints/AuthorizationEndpoint.java
      message: AuthorizationEndpoint handles the client authorization request.
  - claim: keycloak#oidc-hands-to-auth-engine
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/LoginActionsService.java
      message: Protocol hands login off to the authentication flow via the authenticate path.
  - claim: keycloak#auth-engine-looks-up-user
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/authentication/AuthenticationProcessor.java
      message: The processor resolves users and validates credentials through the session providers.
  - claim: keycloak#auth-engine-uses-federation
    result: confirmed
    evidence:
      uri: repo:federation/ldap/src/main/java/org/keycloak/storage/ldap/LDAPStorageProvider.java
      message: Federated users are validated through the LDAP/AD storage provider.
  - claim: keycloak#auth-engine-returns-to-oidc
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/LoginActionsService.java
      message: On success the flow completes and an authorization code is returned to the protocol endpoint.
  - claim: keycloak#oidc-issues-token
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/endpoints/TokenEndpoint.java
      message: TokenEndpoint.processGrantRequest exchanges the code through TokenManager.
  - claim: keycloak#token-issued-to-client
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/TokenManager.java
      message: TokenManager creates the access/ID/refresh token response returned to the client.
  - claim: keycloak#oidc-brokers-login
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/IdentityBrokerService.java
      message: performLogin routes the login through the configured identity provider.
  - claim: keycloak#broker-redirects-to-idp
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/broker/oidc/OIDCIdentityProvider.java
      message: OIDCIdentityProvider performs the authentication URL redirect to the external provider.
  - claim: keycloak#idp-returns-identity
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/IdentityBrokerService.java
      message: The getEndpoint callback and authenticated(BrokeredIdentityContext) receive the returned identity.
  - claim: keycloak#broker-maps-user
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/broker/provider/IdentityProviderMapper.java
      message: Mappers and the broker map the returned identity onto a realm user.
  - claim: keycloak#broker-returns-to-oidc
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/services/resources/IdentityBrokerService.java
      message: afterFirstBrokerLogin / afterPostBrokerLoginFlow complete and hand back to the protocol endpoint.
  - claim: keycloak#federation-looks-up-ldap
    result: confirmed
    evidence:
      uri: repo:federation/ldap/src/main/java/org/keycloak/storage/ldap/LDAPStorageProviderFactory.java
      message: getUserByUsername / validCredentials query the LDAP/Active Directory store.
  - claim: keycloak#federation-syncs-store
    result: confirmed
    evidence:
      uri: repo:federation/ldap/src/main/java/org/keycloak/storage/ldap/LDAPStorageProviderFactory.java
      message: Implements ImportSynchronization with IMPORT_ENABLED for writing federated users back.
  - claim: keycloak#enforcer-checks-authz
    result: confirmed
    evidence:
      uri: repo:authz/client/src/main/java/org/keycloak/authorization/client/ClientAuthorizationContext.java
      message: The authz client obtains permission and policy decisions from the authorization services.
  - claim: keycloak#spi-serves-auth-engine
    result: confirmed
    evidence:
      uri: repo:server-spi-private/src/main/java/org/keycloak/authentication/AuthenticatorSpi.java
  - claim: keycloak#spi-serves-user-federation
    result: confirmed
    evidence:
      uri: repo:model/storage/src/main/java/org/keycloak/storage/UserStorageProviderSpi.java
  - claim: keycloak#spi-serves-broker
    result: confirmed
    evidence:
      uri: repo:server-spi-private/src/main/java/org/keycloak/broker/provider/IdentityProviderSpi.java
  - claim: keycloak#protocol-mapper-serves-token
    result: confirmed
    evidence:
      uri: repo:services/src/main/java/org/keycloak/protocol/oidc/mappers/AbstractOIDCProtocolMapper.java
      message: Mappers attach claims to tokens during TokenManager issuance.

  # --- Interpretive / not observable from this repository ---
  - claim: keycloak#enforcer-protects-client
    result: unknown
    evidence:
      uri: repo:core/src/main/java/org/keycloak/representations/adapters/config/PolicyEnforcerConfig.java
      message: >-
        The PolicyEnforcerConfig, AuthorizationContext, and authz/client exist in
        this repository, but the enforcer runtime and which client applications
        actually embed it are not observable from the server repository.
