format: yarramate/likec4-project/v1
id: miniflux
version: "1.0"
title: Miniflux architecture
mapping: integrations/likec4/subject-mapping.yaml
views:
  - projection: projections/system-overview.yaml
  - projection: projections/http-surfaces.yaml
  - projection: projections/persistence.yaml
  - id: feed-refresh-flow
    projection: projections/feed-refresh-flow.yaml
    dynamic:
      steps:
        - relationship: miniflux#scheduler-selects-due-feeds
        - relationship: miniflux#scheduler-dispatches-jobs
        - relationship: miniflux#pool-runs-refresh
        - relationship: miniflux#publisher-supplies-feeds
        - relationship: miniflux#pipeline-stores-entries
        - relationship: miniflux#pipeline-notifies-integrations
        - relationship: miniflux#hub-delivers-entries
  - id: save-entry-flow
    projection: projections/save-entry-flow.yaml
    dynamic:
      steps:
        - relationship: miniflux#reader-saves-entry
        - relationship: miniflux#webui-sends-saved-entry
        - relationship: miniflux#hub-delivers-entries
