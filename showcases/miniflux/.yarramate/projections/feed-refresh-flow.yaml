format: yarramate/projection/v1
id: feed-refresh-flow
version: "1.0"
query:
  subjects:
    - miniflux#feed-scheduler
    - miniflux#worker-pool
    - miniflux#feed-pipeline
    - miniflux#feed-publisher
    - miniflux#storage
    - miniflux#integration-hub
    - miniflux#integration-target
    - miniflux#feed
  relationships: between
presentation:
  title: Background feed refresh flow
  description: >-
    Ordered flow: the scheduler selects due feeds and dispatches jobs, the
    worker pool runs RefreshFeed, the pipeline fetches and processes feed
    documents, new entries are persisted, and enabled integrations are
    notified.
