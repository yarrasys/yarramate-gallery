format: yarramate/projection/v1
id: push-heartbeat-flow
version: "1.0"
query:
  subjects:
    - uptime-kuma#push-agent
    - uptime-kuma#server-core
    - uptime-kuma#heartbeat-history
    - uptime-kuma#web-app
  relationships: between
presentation:
  title: Push heartbeat flow
  description: >-
    Ordered flow of a passive push monitor: an external agent calls
    /api/push/:pushToken, the server records the heartbeat, and live status
    streams to the dashboard.
