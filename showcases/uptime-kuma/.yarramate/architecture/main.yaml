format: yarramate/v1
id: uptime-kuma
profile: yarramate/core@0.1
concepts:
  - id: operator
    kind: businessActor
    name: Operator
    description: >-
      Self-hosting administrator who signs in to the dashboard (JWT login with
      optional 2FA) to configure monitors, notifications, status pages, and
      maintenance windows.
  - id: status-visitor
    kind: businessActor
    name: Status page visitor
    description: >-
      Anonymous consumer of public status pages, badges, and RSS feeds; no
      authentication required.
  - id: uptime-monitoring
    kind: applicationService
    name: Uptime monitoring
    description: >-
      Scheduled probing of configured targets with uptime history, response
      statistics, certificate expiry tracking, and alerting on status change.
  - id: status-publication
    kind: applicationService
    name: Status publication
    description: >-
      Public status pages, incident history, SVG badges, and RSS feeds derived
      from monitor state.
  - id: web-app
    kind: applicationComponent
    name: Dashboard SPA
    description: >-
      Vue 3 single-page application (src/) built with Vite; management UI and
      live charts, communicating with the server over Socket.IO.
  - id: server-core
    kind: applicationComponent
    name: Server core
    description: >-
      UptimeKumaServer singleton (server/uptime-kuma-server.js) wiring Express
      and Socket.IO; owns authentication, socket handlers, HTTP routers
      (status pages, badges, push endpoint, /metrics), and serves the built
      SPA.
  - id: monitor-engine
    kind: applicationComponent
    name: Monitor engine
    description: >-
      Per-monitor check loop (server/model/monitor.js) computing uptime and
      driving alerting. Check types resolve two ways: http, keyword,
      json-query, and ping are legacy branches inline in the loop, while
      newer types (TCP, DNS, MQTT, SNMP, gRPC, databases, and more) dispatch
      through UptimeKumaServer.monitorTypeList to server/monitor-types/.
  - id: notification-hub
    kind: applicationComponent
    name: Notification hub
    description: >-
      Provider registry and dispatch (server/notification.js) fanning alerts
      out to ~99 notification provider integrations under
      server/notification-providers/.
  - id: monitored-target
    kind: applicationComponent
    name: Monitored target
    description: >-
      External service or host being probed. Outside the repository boundary;
      represented by the integration points in server/monitor-types/.
  - id: notification-channel
    kind: applicationService
    name: Notification channels
    description: >-
      External delivery services (Telegram, Slack, SMTP, PagerDuty, webhooks,
      and others) that receive alert and recovery messages. Outside the
      repository boundary.
  - id: push-agent
    kind: applicationComponent
    name: Push agent
    description: >-
      External system that reports its own liveness by calling the passive
      push endpoint /api/push/:pushToken. Outside the repository boundary.
  - id: metrics-scraper
    kind: applicationComponent
    name: Metrics scraper
    description: >-
      External Prometheus-compatible collector scraping the /metrics endpoint.
      Assumed consumer; only the endpoint is present in the repository.
  - id: monitor-config
    kind: dataObject
    name: Monitor configuration
    description: >-
      Monitors, notification settings, users, tags, status pages, and
      maintenance windows as defined by the schema in db/knex_init_db.js and
      db/knex_migrations/.
  - id: heartbeat-history
    kind: dataObject
    name: Heartbeat history
    description: >-
      Per-check heartbeat records and aggregated uptime/response statistics
      (heartbeat and stat tables).
  - id: app-database
    kind: systemSoftware
    name: Application database
    description: >-
      Relational store accessed through knex and redbean-node
      (server/database.js). SQLite is the default (embedded kuma.db); MariaDB
      and embedded MariaDB are supported alternatives.
  - id: docker-runtime
    kind: node
    name: Docker runtime
    description: >-
      Official deployment as the louislam/uptime-kuma container image: a
      single Node.js process (node server/server.js) exposing port 3001 with
      persistent state under the /app/data volume (compose.yaml,
      docker/dockerfile).
relationships:
  - id: ui-serves-operator
    kind: serving
    from: web-app
    to: operator
    description: The dashboard SPA is the operator's management surface.
  - id: core-serves-webapp
    kind: serving
    from: server-core
    to: web-app
    description: >-
      Serves the built SPA assets and exposes the Socket.IO API the SPA uses
      for all management operations.
  - id: core-streams-events
    kind: flow
    from: server-core
    to: web-app
    content: live heartbeat, uptime, and status events over Socket.IO
    description: >-
      Heartbeat results and aggregate statistics are pushed to connected
      dashboard sessions in real time.
  - id: monitoring-serves-operator
    kind: serving
    from: uptime-monitoring
    to: operator
    description: The monitoring service is operated for and consumed by the operator.
  - id: engine-realizes-monitoring
    kind: realization
    from: monitor-engine
    to: uptime-monitoring
    description: The check loop and monitor types implement the monitoring service.
  - id: core-realizes-status-publication
    kind: realization
    from: server-core
    to: status-publication
    description: >-
      Implemented by the status page and badge HTTP routers
      (server/routers/status-page-router.js, server/routers/api-router.js).
  - id: status-serves-visitor
    kind: serving
    from: status-publication
    to: status-visitor
    description: Public, unauthenticated status pages, badges, and RSS feeds.
  - id: core-starts-monitors
    kind: flow
    from: server-core
    to: monitor-engine
    content: start, restart, and stop commands for per-monitor check loops
    description: >-
      Starts, restarts, and stops per-monitor check loops at server startup
      and on operator commands (startMonitors/startMonitor in
      server/server.js).
  - id: engine-probes-target
    kind: flow
    from: monitor-engine
    to: monitored-target
    content: health probes (HTTP(S), TCP, DNS, ping, MQTT, SNMP, database, and other checks)
    description: Each monitor type actively probes its configured target on an interval.
  - id: engine-records-heartbeats
    kind: access
    from: monitor-engine
    to: heartbeat-history
    mode: read-write
    description: >-
      Writes a heartbeat per check, reads the previous beat, and maintains
      aggregated uptime statistics.
  - id: engine-reads-config
    kind: access
    from: monitor-engine
    to: monitor-config
    mode: read
    description: Check loops are driven by the persisted monitor definitions.
  - id: engine-triggers-notifications
    kind: flow
    from: monitor-engine
    to: notification-hub
    content: notification dispatch requests on important status changes
    description: >-
      On important status changes (and on the configured resend interval) the
      engine dispatches notifications, suppressed during maintenance.
  - id: hub-delivers-alerts
    kind: flow
    from: notification-hub
    to: notification-channel
    content: alert and recovery messages
    description: The matching provider formats and delivers the message per channel.
  - id: core-manages-config
    kind: access
    from: server-core
    to: monitor-config
    mode: read-write
    description: >-
      Socket handlers create, update, and delete monitors, notifications,
      status pages, and related settings.
  - id: core-accesses-heartbeats
    kind: access
    from: server-core
    to: heartbeat-history
    mode: read-write
    description: >-
      Reads history for dashboards, badges, and status pages; records
      heartbeats received on the push endpoint.
  - id: agent-pushes-heartbeat
    kind: flow
    from: push-agent
    to: server-core
    content: passive heartbeat pushes to /api/push/:pushToken
    description: >-
      Push monitors are satisfied by inbound calls instead of active probing
      (server/routers/api-router.js).
  - id: core-serves-scraper
    kind: serving
    from: server-core
    to: metrics-scraper
    description: >-
      Exposes Prometheus metrics at /metrics behind API-key/basic
      authentication (server/server.js).
  - id: db-persists-config
    kind: realization
    from: app-database
    to: monitor-config
    description: Configuration tables are held in the relational store.
  - id: db-persists-heartbeats
    kind: realization
    from: app-database
    to: heartbeat-history
    description: Heartbeat and aggregate stat tables are held in the relational store.
  - id: runtime-hosts-core
    kind: assignment
    from: docker-runtime
    to: server-core
    description: >-
      One container, one Node.js process: server core, monitor engine, and
      notification hub all run in this process; SQLite data lives on the
      /app/data volume.
