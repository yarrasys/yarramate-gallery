format: yarramate/evidence/v1
id: uptime-kuma-repository
version: "1.0"
provider: repository-inspection
observations:
  - subject: uptime-kuma#web-app
    result: confirmed
    evidence:
      uri: repo:src/main.js
      message: Vue 3 SPA entry; router in src/router.js, built via config/vite.config.js.
  - subject: uptime-kuma#server-core
    result: confirmed
    evidence:
      uri: repo:server/uptime-kuma-server.js
      message: >-
        UptimeKumaServer singleton; server/server.js wires Express, Socket.IO
        handlers, routers, auth, and /metrics.
  - subject: uptime-kuma#monitor-engine
    result: confirmed
    evidence:
      uri: repo:server/model/monitor.js
      message: >-
        Check loop; http, keyword, json-query, and ping branch inline
        (monitor.js:473, 681, 728), while 25 concrete modules under
        server/monitor-types/ dispatch via monitorTypeList (monitor.js:869).
  - subject: uptime-kuma#notification-hub
    result: confirmed
    evidence:
      uri: repo:server/notification.js
      message: Provider registry; 99 provider modules under server/notification-providers/.
  - subject: uptime-kuma#uptime-monitoring
    result: confirmed
    evidence:
      uri: repo:README.md
      message: Monitoring feature set stated in README and implemented by the monitor engine.
  - subject: uptime-kuma#status-publication
    result: confirmed
    evidence:
      uri: repo:server/routers/status-page-router.js
      message: Public status page, RSS, heartbeat, and badge routes without authentication.
  - subject: uptime-kuma#monitor-config
    result: confirmed
    evidence:
      uri: repo:db/knex_init_db.js
      message: monitor, notification, user, tag, and related tables created here and in db/knex_migrations/.
  - subject: uptime-kuma#heartbeat-history
    result: confirmed
    evidence:
      uri: repo:db/knex_init_db.js
      message: heartbeat table with monitor foreign key; aggregates via server/uptime-calculator.js.
  - subject: uptime-kuma#app-database
    result: confirmed
    evidence:
      uri: repo:server/database.js
      message: knex/redbean over SQLite (default), MariaDB, or embedded MariaDB.
  - subject: uptime-kuma#docker-runtime
    result: confirmed
    evidence:
      uri: repo:compose.yaml
      message: >-
        louislam/uptime-kuma:2 image, port 3001, ./data:/app/data volume;
        docker/dockerfile CMD node server/server.js.
  - subject: uptime-kuma#monitored-target
    result: confirmed
    evidence:
      uri: repo:server/monitor-types/monitor-type.js
      message: >-
        External targets are outside the repository; the probe integration
        points for each check type are observed.
  - subject: uptime-kuma#notification-channel
    result: confirmed
    evidence:
      uri: repo:server/notification-providers
      message: >-
        External channels are outside the repository; 99 provider integrations
        are observed.
  - subject: uptime-kuma#push-agent
    result: confirmed
    evidence:
      uri: repo:server/routers/api-router.js
      message: /api/push/:pushToken endpoint for passive heartbeat reporting.
  - subject: uptime-kuma#metrics-scraper
    result: unknown
    evidence:
      uri: repo:server/server.js
      message: >-
        The /metrics endpoint exists (app.get("/metrics", apiAuth, ...)), but
        no scraper is part of the repository; an actual Prometheus consumer is
        assumed, not observed.
  - claim: uptime-kuma#core-starts-monitors
    result: confirmed
    evidence:
      uri: repo:server/server.js
      message: startMonitors() on startup; startMonitor/restartMonitor on operator commands.
  - claim: uptime-kuma#engine-probes-target
    result: confirmed
    evidence:
      uri: repo:server/monitor-types/monitor-type.js
      message: check(monitor, heartbeat, server) contract implemented per type.
  - claim: uptime-kuma#engine-records-heartbeats
    result: confirmed
    evidence:
      uri: repo:server/model/monitor.js
      message: R.dispense("heartbeat"), previous-beat lookup, and aggregate updates in the beat loop.
  - claim: uptime-kuma#engine-reads-config
    result: confirmed
    evidence:
      uri: repo:server/model/monitor.js
      message: Monitor bean fields drive interval, type, and check parameters.
  - claim: uptime-kuma#engine-triggers-notifications
    result: confirmed
    evidence:
      uri: repo:server/model/monitor.js
      message: >-
        Monitor.sendNotification on important beats (line ~970), suppressed
        under maintenance; resend via resendInterval.
  - claim: uptime-kuma#hub-delivers-alerts
    result: confirmed
    evidence:
      uri: repo:server/notification.js
      message: Provider lookup and send per configured notification.
  - claim: uptime-kuma#core-streams-events
    result: confirmed
    evidence:
      uri: repo:server/model/monitor.js
      message: io.to(user_id).emit("heartbeat"/"avgPing"/"uptime") via the server's Socket.IO instance.
  - claim: uptime-kuma#core-manages-config
    result: confirmed
    evidence:
      uri: repo:server/server.js
      message: Socket handlers (add/editMonitor, notification, status page, maintenance) persist via redbean.
  - claim: uptime-kuma#core-accesses-heartbeats
    result: confirmed
    evidence:
      uri: repo:server/routers/api-router.js
      message: Badge and push routes read and write heartbeat records.
  - claim: uptime-kuma#agent-pushes-heartbeat
    result: confirmed
    evidence:
      uri: repo:server/routers/api-router.js
      message: router.all("/api/push/:pushToken") records a heartbeat per call.
  - claim: uptime-kuma#core-serves-scraper
    result: confirmed
    evidence:
      uri: repo:server/server.js
      message: app.get("/metrics", apiAuth, prometheusAPIMetrics()) at line 355.
  - claim: uptime-kuma#core-realizes-status-publication
    result: confirmed
    evidence:
      uri: repo:server/routers/status-page-router.js
      message: Status page and badge routes are registered on the Express app.
  - claim: uptime-kuma#runtime-hosts-core
    result: confirmed
    evidence:
      uri: repo:docker/dockerfile
      message: EXPOSE 3001; CMD ["node", "server/server.js"]; healthcheck binary.
  - claim: uptime-kuma#db-persists-config
    result: confirmed
    evidence:
      uri: repo:db/knex_init_db.js
      message: Configuration tables created in the relational schema.
  - claim: uptime-kuma#db-persists-heartbeats
    result: confirmed
    evidence:
      uri: repo:db/knex_init_db.js
      message: heartbeat table created in the relational schema.
