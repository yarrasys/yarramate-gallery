format: yarramate/evidence/v1
id: fastify-repository-inspection
version: "1.0"
provider: repository-inspection
observations:
  # --- Concepts: actors, API, grouping ------------------------------------
  - subject: fastify#app-developer
    result: confirmed
    evidence:
      uri: repo:README.md
      message: Quick start and docs/Guides document the developer as the sole consumer role; the actor itself is an interpretation of a library consumer.
  - subject: fastify#public-api
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: Instance API object assembled at lines 120-300 (get/post/route, register, decorate, addHook, addSchema, inject, listen); typed in fastify.d.ts.
  - subject: fastify#framework
    result: confirmed
    evidence:
      uri: repo:package.json
      message: npm package "fastify" v5.10.0; main entry fastify.js; interpretive grouping of fastify.js plus lib/.

  # --- Concepts: core subsystems ------------------------------------------
  - subject: fastify#instance-factory
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: fastify() factory wires router, 404, server, schema controller, hooks, logging and avvio (lines 90-380).
  - subject: fastify#router
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: buildRouting wraps find-my-way; route registration at 356-361, dispatch at 114.
  - subject: fastify#hook-system
    result: confirmed
    evidence:
      uri: repo:lib/hooks.js
      message: applicationHooks and lifecycleHooks arrays (lines 3-23) plus hook runner functions.
  - subject: fastify#plugin-engine
    result: confirmed
    evidence:
      uri: repo:lib/plugin-override.js
      message: override() creates encapsulated child instances; avvio installed in fastify.js:360-378.
  - subject: fastify#content-type-parser
    result: confirmed
    evidence:
      uri: repo:lib/content-type-parser.js
      message: >-
        Per-content-type parser registry run from lib/handle-request.js:73
        (empty content type) and :87 (declared content type).
  - subject: fastify#schema-engine
    result: confirmed
    evidence:
      uri: repo:lib/schema-controller.js
      message: Validator/serializer compiler selection (lines 22-57) with lib/validation.js and lib/schemas.js.
  - subject: fastify#request-reply
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: Reply drives serialization and send (lines 160-380) over raw res (line 67); Request in lib/request.js.
  - subject: fastify#logging
    result: confirmed
    evidence:
      uri: repo:lib/logger-factory.js
      message: Root logger, abstract-logging fallback (line 88) and child logger factory; pino wrapper in lib/logger-pino.js.
  - subject: fastify#server-adapter
    result: confirmed
    evidence:
      uri: repo:lib/server.js
      message: createServer builds node:http/https/http2 servers (lines 3-6, 315-320) and listen/close semantics.
  - subject: fastify#error-handling
    result: confirmed
    evidence:
      uri: repo:lib/error-handler.js
      message: buildErrorHandler chains; FST_ERR codes in lib/errors.js; encapsulated 404 router in lib/four-oh-four.js.

  # --- Concepts: request lifecycle behavior --------------------------------
  - subject: fastify#fn-accept
    result: confirmed
    evidence:
      uri: repo:lib/server.js
      message: Node server accepts requests and calls the bound httpHandler (fastify.js:106,115).
  - subject: fastify#fn-routing
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: router.lookup dispatch (line 114); lifecycle order also documented in docs/Reference/Lifecycle.md.
  - subject: fastify#fn-request-hooks
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: onRequestHookRunner at 560-566; preParsing runner at 654.
  - subject: fastify#fn-parsing
    result: confirmed
    evidence:
      uri: repo:lib/handle-request.js
      message: contentTypeParser.run at line 74 after preParsing.
  - subject: fastify#fn-validation
    result: confirmed
    evidence:
      uri: repo:lib/validation.js
      message: compileSchemasForValidation (lines 57-79) invoked from handle-request via validateSchema.
  - subject: fastify#route-handler
    result: confirmed
    evidence:
      uri: repo:lib/handle-request.js
      message: preHandlerHookRunner then handler invocation; handler bodies are user code outside this repository (contract in docs/Reference/Routes.md).
  - subject: fastify#fn-serialization
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: preSerializationHook at 207/227; serializer resolution at 348-378.
  - subject: fastify#fn-respond
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: onSendHook at 167/232; raw statusCode write at 340; onResponse listeners set up by setupResponseListeners.
  - subject: fastify#fn-not-found
    result: confirmed
    evidence:
      uri: repo:lib/four-oh-four.js
      message: Dedicated find-my-way 404 router with encapsulated not-found handlers; wired as defaultRoute in fastify.js:102-103.

  # --- Concepts: plugin flow behavior --------------------------------------
  - subject: fastify#fn-register
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: avvio installed with custom override at lines 360-378; register queues plugins on the boot queue.
  - subject: fastify#fn-app-hooks
    result: confirmed
    evidence:
      uri: repo:lib/plugin-override.js
      message: onRegister fired per encapsulated instance at line 71; other application hooks listed in lib/hooks.js:3-10.

  # --- Concepts: external dependencies -------------------------------------
  - subject: fastify#dep-find-my-way
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency find-my-way ^9.6.0; required in lib/route.js:3 and lib/four-oh-four.js:3.
  - subject: fastify#dep-avvio
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency avvio ^9.0.0; required in fastify.js:5.
  - subject: fastify#dep-pino
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency pino ^9.14.0 || ^10.1.0; required in lib/logger-pino.js:9.
  - subject: fastify#dep-ajv
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency @fastify/ajv-compiler ^4.0.5; lazily required in lib/schema-controller.js:22.
  - subject: fastify#dep-fjs
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency @fastify/fast-json-stringify-compiler ^5.0.0; lazily required in lib/schema-controller.js:26.
  - subject: fastify#dep-light-my-request
    result: confirmed
    evidence:
      uri: repo:package.json
      message: Dependency light-my-request ^6.0.0; lazily required in fastify.js:479 for inject().
  - subject: fastify#node-http
    result: confirmed
    evidence:
      uri: repo:lib/server.js
      message: node:http, node:https, node:http2 required at lines 3-5.

  # --- Concepts: principal information --------------------------------------
  - subject: fastify#route-definition
    result: confirmed
    evidence:
      uri: repo:lib/context.js
      message: Context constructor holds schema, handler, hooks, config per route; stored via router.on in lib/route.js:360.
  - subject: fastify#json-schemas
    result: confirmed
    evidence:
      uri: repo:lib/schema-controller.js
      message: Schema buckets per encapsulation context; addSchema/getSchemas; compiled by validator/serializer compilers.
  - subject: fastify#encapsulation-context
    result: confirmed
    evidence:
      uri: repo:lib/plugin-override.js
      message: Child instance state copied at lines 39-51 (reply/request prototypes, parsers, hooks, prefix, schema controller, log level).

  # --- Claims: API surface --------------------------------------------------
  - claim: fastify#factory-realizes-api
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: Public instance object literal assembled at lines 120-300.
  - claim: fastify#api-serves-developer
    result: confirmed
    evidence:
      uri: repo:README.md
      message: Quick start demonstrates consumption of the instance API.
  - claim: fastify#developer-supplies-handlers
    result: not-observed
    evidence:
      uri: repo:docs/Reference/Routes.md
      message: Handler implementations live outside this repository; only the contract and examples are present.

  # --- Claims: external dependency serving -----------------------------------
  - claim: fastify#fmw-serves-router
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: FindMyWay(options) at line 78; lookup bound at 114.
  - claim: fastify#avvio-serves-plugin-engine
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: Avvio(fastify, ...) with avvio.override = override at lines 369-377.
  - claim: fastify#pino-serves-logging
    result: confirmed
    evidence:
      uri: repo:lib/logger-pino.js
      message: pino required at line 9; only loaded when logging is enabled (abstract-logging no-op otherwise, lib/logger-factory.js:88).
  - claim: fastify#ajv-serves-schema
    result: confirmed
    evidence:
      uri: repo:lib/schema-controller.js
      message: "@fastify/ajv-compiler required at line 22 unless a custom validator compiler is supplied."
  - claim: fastify#fjs-serves-schema
    result: confirmed
    evidence:
      uri: repo:lib/schema-controller.js
      message: "@fastify/fast-json-stringify-compiler required at line 26 unless a custom serializer compiler is supplied."
  - claim: fastify#lmr-serves-factory
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: light-my-request lazily required at line 479 inside inject().
  - claim: fastify#nodehttp-serves-server
    result: confirmed
    evidence:
      uri: repo:lib/server.js
      message: http/https/http2 server creation at lines 315-320.
  - claim: fastify#schema-serves-reply
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: serializerCompiler resolved via route context or schema controller at lines 372-378.
  - claim: fastify#errors-serve-reply
    result: confirmed
    evidence:
      uri: repo:lib/error-handler.js
      message: handleError routes through the encapsulated error handler chain; fallback serializer in lib/error-serializer.js.

  # --- Claims: request lifecycle transitions ---------------------------------
  - claim: fastify#accept-triggers-routing
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: httpHandler = wrapRouting(router, options) at line 106, passed to createServer at 115.
  - claim: fastify#routing-triggers-request-hooks
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: onRequestHookRunner invoked after route resolution at lines 560-566.
  - claim: fastify#request-hooks-trigger-parsing
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: >-
        preParsingHookRunner then handleRequest at lines 654-657; parser run
        in lib/handle-request.js:73 and :87.
  - claim: fastify#parsing-triggers-validation
    result: confirmed
    evidence:
      uri: repo:lib/handle-request.js
      message: validateSchema called after body parsing; order also documented in docs/Reference/Lifecycle.md.
  - claim: fastify#validation-triggers-handler
    result: confirmed
    evidence:
      uri: repo:lib/handle-request.js
      message: preHandlerHookRunner then handler invocation.
  - claim: fastify#handler-triggers-serialization
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: send() enters preSerializationHook at lines 207/227; async returns wrapped by lib/wrap-thenable.js.
  - claim: fastify#serialization-triggers-respond
    result: confirmed
    evidence:
      uri: repo:lib/reply.js
      message: onSendHook at lines 167/232 then raw write (line 340).
  - claim: fastify#routing-triggers-not-found
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: fourOhFour built at line 103 and installed as the router defaultRoute.

  # --- Claims: plugin registration transitions --------------------------------
  - claim: fastify#api-triggers-register
    result: confirmed
    evidence:
      uri: repo:fastify.js
      message: register delegated to avvio boot queue (lines 360-378).
  - claim: fastify#register-creates-context
    result: confirmed
    evidence:
      uri: repo:lib/plugin-override.js
      message: Object.create(old) child instance with copied state at lines 39-51.
  - claim: fastify#register-fires-app-hooks
    result: confirmed
    evidence:
      uri: repo:lib/plugin-override.js
      message: onRegister hooks called at line 71.

  # --- Claims: principal information access -----------------------------------
  - claim: fastify#router-stores-routes
    result: confirmed
    evidence:
      uri: repo:lib/route.js
      message: router.on(method, url, {constraints}, routeHandler, context) at line 360.
  - claim: fastify#lifecycle-reads-routes
    result: confirmed
    evidence:
      uri: repo:lib/handle-request.js
      message: request[kRouteContext] consulted for parser/validation/serializer configuration.
  - claim: fastify#schema-stores-schemas
    result: confirmed
    evidence:
      uri: repo:lib/schema-controller.js
      message: Per-context schema buckets and compiler caches.
